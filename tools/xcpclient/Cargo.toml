[package]
name = "xcpclient"
version = "3.0.1"
edition = "2024"
resolver = "2"
authors = ["RainerZ"]
description = "Simple XCP test client and ELF/A2L utilities"
readme = "README.md"
keywords = ["XCP","ASAM","CANape","A2L"]
license = "MIT"  
repository = "https://github.com/vectorgrp/XCPlite"
categories = ["measurement and calibration"] 

 # more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.32"
env_logger = "0.11.10"
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
lazy_static = "1.5"
byteorder = "1.5.0"
bytes = "1.11.1"
regex = "1.12.3"
chrono = "0.4.45"
parking_lot = "0.12.5"
tokio = { version = "1.52", features = ["full"] }
ihex = "3.0"

# ELF/DWARF Debug info parsing dependencies
gimli = "0.28"  # 0.29+ has breaking API changes in attr_value (Option vs Result)
object = "0.36" # keep in sync with gimli
pdb2 = "0.10"
memmap2 = "0.9"
indexmap = "2.14"
cpp_demangle = "0.4"  # 0.5 removed DemangleOptions, would require code changes


# xcp_registry from xcp-lite on Github
# From VectorGrp/xcp-lite
xcp_registry = { git = "https://github.com/vectorgrp/xcp-lite", features = ["a2l_reader"] }


# From fork RainerZ/xcp-lite
#xcp_registry = { git = "https://github.com/RainerZ/xcp-lite.git", branch = "V3.0.2", features = ["a2l_reader"] }
# From local directory current branch
#xcp_registry = { path = "../../../xcp-lite-RainerZ/xcp_registry", features = ["a2l_reader"] } 


# Added to upstream (issue 402). a2lfile, which xcp_registry's a2l_reader uses to load and check A2L
# files, from a fork: 3.5.1 plus a check() that finds the users of each TYPEDEF_CHARACTERISTIC once
# instead of once per typedef, which made checking an A2L quadratic in its structure fields
# (129,035 typedef characteristics: 142 s, now 0.1 s). Replaces the crates.io release everywhere in
# the build, xcp_registry included.
[patch.crates-io]
a2lfile = { git = "https://github.com/GjergjiShkurti/a2lfile", rev = "36ba0a4dbd62a4946404bea4ec06cc6a029f9c33" }


[lints.rust]
dead_code = "allow"
unused_variables = "allow"

[build-dependencies]





